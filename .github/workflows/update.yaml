name: Update Tweets

on:
  schedule:
    - cron: '0 */6 * * *' # 6時間おきに自動実行
  workflow_dispatch: # GitHubの画面から手動でも実行可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python update_tweets.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update tweets.json" && git push)